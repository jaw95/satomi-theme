<!-- Shopify page: Barometer | handle: barometer | template: page -->
<div id="cb" style="max-width:420px;margin:0 auto;padding:28px 20px 40px;background:#0f1512;color:#e9e4d6;font-family:'Helvetica Neue',Arial,sans-serif;border-radius:16px;">
<style>
#cb * { box-sizing:border-box; }
#cb .cb-place { font-size:14px; color:#8c948c; margin:0 0 6px; }
#cb .cb-now { display:flex; align-items:flex-end; gap:14px; margin:0; }
#cb .cb-now b { font-size:92px; font-weight:300; letter-spacing:-3px; line-height:0.9; font-variant-numeric:tabular-nums; color:#e9e4d6; }
#cb .cb-now small { font-size:15px; color:#8c948c; padding-bottom:10px; line-height:1.3; }
#cb .cb-trend { display:flex; align-items:center; gap:10px; margin:18px 0 0; font-size:18px; }
#cb .cb-arrow { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:20px; background:#243029; }
#cb .cb-trend.falling .cb-arrow { background:#2b4a3a; color:#63b37a; }
#cb .cb-trend.rising .cb-arrow { background:#4a3a1e; color:#e6a33a; }
#cb .cb-verdict { margin:22px 0 0; padding:16px 18px; border-left:3px solid #e6a33a; font-size:17px; line-height:1.45; }
#cb .cb-verdict.go { border-color:#63b37a; }
#cb svg { width:100%; height:150px; margin-top:26px; display:block; overflow:visible; }
#cb .cb-cond { display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; margin-top:22px; font-size:15px; }
#cb .cb-cond span { color:#8c948c; }
#cb .cb-cond .v { color:#e9e4d6; }
#cb .cb-foot { display:flex; justify-content:space-between; align-items:center; margin-top:28px; font-size:13px; color:#8c948c; }
#cb button { background:none; border:1px solid #243029; color:#e9e4d6; border-radius:999px; padding:10px 18px; font-size:15px; }
#cb .cb-err { color:#e6a33a; font-size:14px; margin-top:14px; }
</style>
<p class="cb-place">Crasville, Cotentin</p>
<p class="cb-now"><b id="cb-p">—</b><small>hPa<br>sea level</small></p>
<div class="cb-trend" id="cb-trend">
<div class="cb-arrow" id="cb-arrow">–</div>
<div id="cb-trendtext">Reading the glass…</div>
</div>
<div class="cb-verdict" id="cb-verdict"></div>
<svg id="cb-chart" viewbox="0 0 380 150"></svg>
<div class="cb-cond">
<div>
<span>Air</span><br><span class="v" id="cb-temp">—</span>
</div>
<div>
<span>Wind</span><br><span class="v" id="cb-wind">—</span>
</div>
<div>
<span>Cloud</span><br><span class="v" id="cb-cloud">—</span>
</div>
<div>
<span>Sunrise</span><br><span class="v" id="cb-sun">—</span>
</div>
</div>
<div class="cb-err" id="cb-err"></div>
<div class="cb-foot">
<span id="cb-stamp">Updates every 15 min</span><button id="cb-btn" type="button">Refresh</button>
</div>
</div>
<script>
(function(){
var LAT=49.554,LON=-1.338;
var URL='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=pressure_msl,temperature_2m,wind_speed_10m,wind_direction_10m,cloud_cover&hourly=pressure_msl&daily=sunrise&past_hours=12&forecast_hours=36&timezone=auto';
var $=function(id){return document.getElementById(id);};
var dirs=['N','NE','E','SE','S','SW','W','NW'];
function verdict(p,d3){
 if(d3<=-0.8)return['go','Glass is falling. Get on the bottom, bait properly, fish the windward bank.'];
 if(d3>=0.8)return['wait','Glass is rising. Fish will sit high: single baits, margins, floaters.'];
 if(p>=1023)return['wait','High and steady. Fish up in the water; light baiting, patience till it moves.'];
 if(p<=1016)return['go','Low and settled. Prime feeding pressure. Fish through the night.'];
 return['go','Middling and steady. Worth fishing; dawn and dusk are the windows.'];
}
function draw(times,vals,nowIdx){
 var W=380,H=150,padL=34,padB=22,padT=10;
 var min=Math.floor(Math.min.apply(null,vals))-1,max=Math.ceil(Math.max.apply(null,vals))+1;
 var x=function(i){return padL+(i/(vals.length-1))*(W-padL-6);};
 var y=function(v){return padT+(1-(v-min)/(max-min))*(H-padT-padB);};
 var s='',step=(max-min>8?4:2);
 for(var g=min;g<=max;g+=step){s+='<line x1="'+padL+'" x2="'+(W-6)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#243029"/>';s+='<text x="'+(padL-6)+'" y="'+(y(g)+4)+'" fill="#8c948c" font-size="11" text-anchor="end">'+g+'</text>';}
 var path=vals.map(function(v,i){return(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);}).join(' ');
 s+='<path d="'+path+'" fill="none" stroke="#4f9cc2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
 s+='<line x1="'+x(nowIdx)+'" x2="'+x(nowIdx)+'" y1="'+padT+'" y2="'+(H-padB)+'" stroke="#e6a33a" stroke-dasharray="3 4"/>';
 s+='<circle cx="'+x(nowIdx)+'" cy="'+y(vals[nowIdx])+'" r="5" fill="#e6a33a" stroke="#0f1512" stroke-width="2"/>';
 var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 times.forEach(function(t,i){var dt=new Date(t),h=dt.getHours();if(h%6===0){s+='<text x="'+x(i)+'" y="'+(H-6)+'" fill="#8c948c" font-size="11" text-anchor="middle">'+(h===0?days[dt.getDay()]:h+':00')+'</text>';}});
 s+='<text x="'+x(nowIdx)+'" y="'+(padT-1)+'" fill="#e6a33a" font-size="11" text-anchor="middle">now</text>';
 $('cb-chart').innerHTML=s;
}
function load(){
 $('cb-err').textContent='';
 fetch(URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
  var c=d.current,h=d.hourly;
  var idx=h.time.indexOf(c.time.slice(0,13)+':00');if(idx<0)idx=12;
  var d3=c.pressure_msl-h.pressure_msl[Math.max(0,idx-3)];
  $('cb-p').textContent=c.pressure_msl.toFixed(1);
  $('cb-trend').className='cb-trend '+(d3<=-0.5?'falling':d3>=0.5?'rising':'steady');
  $('cb-arrow').textContent=d3<=-0.5?'↓':d3>=0.5?'↑':'→';
  $('cb-trendtext').textContent=(d3<=-0.5?'Falling':d3>=0.5?'Rising':'Steady')+' · '+(d3>=0?'+':'')+d3.toFixed(1)+' hPa over 3 h';
  var v=verdict(c.pressure_msl,d3);$('cb-verdict').className='cb-verdict '+v[0];$('cb-verdict').textContent=v[1];
  $('cb-temp').textContent=Math.round(c.temperature_2m)+'°C';
  $('cb-wind').textContent=Math.round(c.wind_speed_10m)+' km/h '+dirs[Math.round(c.wind_direction_10m/45)%8];
  $('cb-cloud').textContent=Math.round(c.cloud_cover)+'%';
  $('cb-sun').textContent=new Date(d.daily.sunrise[0]).toTimeString().slice(0,5);
  draw(h.time,h.pressure_msl,idx);
  $('cb-stamp').textContent='Live · '+new Date().toTimeString().slice(0,5);
 }).catch(function(){$('cb-err').textContent="Couldn't reach the weather service. Check signal and refresh.";});
}
$('cb-btn').addEventListener('click',load);
load();setInterval(load,15*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
})();
</script>
