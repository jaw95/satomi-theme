<div id="cb" style="max-width:420px;margin:0 auto;padding:24px 20px 40px;background:#0f1512;color:#e9e4d6;font-family:'Helvetica Neue',Arial,sans-serif;border-radius:16px;">
<style>
#cb { --bg:#0f1512; --ink:#e9e4d6; --dim:#8c948c; --line:#243029; --amber:#e6a33a; --water:#4f9cc2; --green:#63b37a; --red:#d9694f; }
#cb * { box-sizing:border-box; }
#cb h1 { font-size:16px; font-weight:400; color:var(--dim); margin:0 0 14px; }
#cb h2 { font-size:14px; font-weight:400; color:var(--dim); margin:34px 0 10px; letter-spacing:0; }
#cb .pick { position:relative; }
#cb .pick input { width:100%; background:#151d18; border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:14px 16px; font-size:17px; outline:none; }
#cb .pick input:focus { border-color:var(--water); }
#cb .list { position:absolute; left:0; right:0; top:100%; margin-top:6px; background:#151d18; border:1px solid var(--line); border-radius:12px; max-height:260px; overflow:auto; z-index:5; display:none; }
#cb .list div { padding:12px 16px; border-bottom:1px solid var(--line); font-size:16px; }
#cb .list div small { display:block; color:var(--dim); font-size:13px; }
#cb .list div:active { background:var(--line); }
#cb .locrow { display:flex; gap:10px; margin:10px 0 0; }
#cb .locrow button { flex:1; }
#cb .browse { display:none; margin-top:10px; background:#151d18; border:1px solid var(--line); border-radius:12px; max-height:340px; overflow:auto; }
#cb .browse.open { display:block; }
#cb .browse h3 { position:sticky; top:0; margin:0; padding:8px 16px; font-size:13px; font-weight:400; color:var(--dim); background:#0f1512; border-bottom:1px solid var(--line); }
#cb .browse div { padding:11px 16px; border-bottom:1px solid var(--line); font-size:16px; }
#cb .browse div small { display:block; color:var(--dim); font-size:13px; }
#cb .browse div:active { background:var(--line); }
#cb .place { font-size:15px; margin:26px 0 6px; }
#cb .place small { color:var(--dim); }
#cb .now { display:flex; align-items:flex-end; gap:14px; margin:0; }
#cb .now b { font-size:92px; font-weight:300; letter-spacing:-3px; line-height:0.9; font-variant-numeric:tabular-nums; color:var(--ink); }
#cb .now small { font-size:15px; color:var(--dim); padding-bottom:10px; line-height:1.3; }
#cb .trend { display:flex; align-items:center; gap:10px; margin:18px 0 0; font-size:18px; }
#cb .arrow { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:20px; background:var(--line); }
#cb .trend.falling .arrow { background:#2b4a3a; color:var(--green); }
#cb .trend.rising .arrow { background:#4a3a1e; color:var(--amber); }
#cb .verdict { margin:22px 0 0; padding:16px 18px; border-left:3px solid var(--amber); font-size:17px; line-height:1.45; }
#cb .verdict.go { border-color:var(--green); }
#cb .rig { margin:12px 0 0; padding:14px 18px; background:#151d18; border-radius:12px; font-size:15px; line-height:1.5; }
#cb .rig b { font-weight:500; color:var(--water); }
#cb svg.chart { width:100%; height:150px; margin-top:26px; display:block; overflow:visible; }
#cb .cond { display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; margin-top:22px; font-size:15px; }
#cb .cond span { color:var(--dim); }
#cb .cond .v { color:var(--ink); }
#cb .windrow { display:flex; gap:18px; align-items:center; margin-top:8px; }
#cb .windrow svg { width:120px; height:120px; flex:none; }
#cb .windrow p { margin:0; font-size:15px; line-height:1.5; }
#cb .plan { margin-top:8px; }
#cb .plan .dates { display:flex; gap:10px; margin-bottom:12px; }
#cb .plan input { flex:1; background:#151d18; border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:10px 12px; font-size:15px; color-scheme:dark; }
#cb .blk { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px; }
#cb .blk .when { flex:none; width:92px; color:var(--dim); }
#cb .blk .tag { flex:none; width:8px; border-radius:4px; }
#cb .blk .why { color:var(--dim); font-size:13px; display:block; margin-top:2px; }
#cb .foot { display:flex; justify-content:space-between; align-items:center; margin-top:28px; font-size:13px; color:var(--dim); }
#cb button { background:none; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:10px 18px; font-size:15px; }
#cb button:active { background:var(--line); }
#cb .err { color:var(--amber); font-size:14px; margin-top:14px; }

function verdictFor(p, d3) {
  if (d3 <= -0.8) return ['go', 'Glass is falling. Get on the bottom, bait properly, fish the windward bank.'];
  if (d3 >= 0.8)  return ['wait', 'Glass is rising. Fish will sit high: single baits, margins, floaters.'];
  if (p >= 1023)  return ['wait', 'High and steady. Fish up in the water; light baiting, patience till it moves.'];
  if (p <= 1016)  return ['go', 'Low and settled. Prime feeding pressure. Fish through the night.'];
  return ['go', 'Middling and steady. Worth fishing; dawn and dusk are the windows.'];
}
function rigFor(p, d3, wt, wind, cloud) {
  if (wt < 8)  return ['Small bottom bait or 10mm pop-up', 'Cold water: tiny amounts of bait, single hookbaits, deeper water.'];
  if (p >= 1022 && d3 > -0.5) return [cloud < 50 ? 'Floater or zig, 2 to 4 ft under the surface' : 'Zig or 3 ft link, mid-water', 'High and steady: fish are up in the layers, not on the deck.'];
  if (d3 <= -0.8 || p <= 1016) return [wind > 15 ? 'Bottom bait over a good spread, windward bank' : 'Bottom bait or wafter, modest baiting', 'Falling or low glass: they are down and feeding.'];
  return ['Wafter or snowman on a bottom rig', 'Middling conditions: fish the deck, top up at dusk.'];
}
function moonPhase(d) {
  const syn = 29.530588853, ref = Date.UTC(2000,0,6,18,14);
  const age = ((d - ref) / 864e5) % syn;
  const a = age < 0 ? age + syn : age;
  const names = ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  return names[Math.floor((a / syn) * 8 + 0.5) % 8];
}

function draw(times, vals, nowIdx) {
  const W=380,H=150,padL=34,padB=22,padT=10;
  const min=Math.floor(Math.min(...vals))-1, max=Math.ceil(Math.max(...vals))+1;
  const x=i=>padL+(i/(vals.length-1))*(W-padL-6), y=v=>padT+(1-(v-min)/(max-min))*(H-padT-padB);
  let s='', step=(max-min>8?4:2);
  for (let g=min; g<=max; g+=step) s+=`<line x1="${padL}" x2="${W-6}" y1="${y(g)}" y2="${y(g)}" stroke="#243029"/><text x="${padL-6}" y="${y(g)+4}" fill="#8c948c" font-size="11" text-anchor="end">${g}</text>`;
  s+=`<path d="${vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')}" fill="none" stroke="#4f9cc2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=`<line x1="${x(nowIdx)}" x2="${x(nowIdx)}" y1="${padT}" y2="${H-padB}" stroke="#e6a33a" stroke-dasharray="3 4"/><circle cx="${x(nowIdx)}" cy="${y(vals[nowIdx])}" r="5" fill="#e6a33a" stroke="#0f1512" stroke-width="2"/>`;
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  times.forEach((t,i)=>{const dt=new Date(t),h=dt.getHours(); if(h%6===0) s+=`<text x="${x(i)}" y="${H-6}" fill="#8c948c" font-size="11" text-anchor="middle">${h===0?days[dt.getDay()]:h+':00'}</text>`;});
  s+=`<text x="${x(nowIdx)}" y="${padT-1}" fill="#e6a33a" font-size="11" text-anchor="middle">now</text>`;
  $('chart').innerHTML=s;
}
function drawRose(deg, spd) {
  const to = (deg + 180) % 360, r = to * Math.PI / 180;
  const cx=60, cy=60, R=48;
  const ex = cx + Math.sin(r)*R*0.8, ey = cy - Math.cos(r)*R*0.8;
  const sx = cx - Math.sin(r)*R*0.8, sy = cy + Math.cos(r)*R*0.8;
  const a0 = r - Math.PI/4, a1 = r + Math.PI/4;
  const arc = `M ${cx+Math.sin(a0)*R} ${cy-Math.cos(a0)*R} A ${R} ${R} 0 0 1 ${cx+Math.sin(a1)*R} ${cy-Math.cos(a1)*R}`;
  $('rose').innerHTML = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#151d18" stroke="#243029"/>
    <path d="${arc}" fill="none" stroke="#63b37a" stroke-width="7" stroke-linecap="round"/>
    <line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#4f9cc2" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M ${ex} ${ey} l ${-8*Math.sin(r)-5*Math.cos(r)} ${8*Math.cos(r)-5*Math.sin(r)} M ${ex} ${ey} l ${-8*Math.sin(r)+5*Math.cos(r)} ${8*Math.cos(r)+5*Math.sin(r)}" stroke="#4f9cc2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="60" y="15" fill="#8c948c" font-size="10" text-anchor="middle">N</text>
    <text x="60" y="66" fill="#e9e4d6" font-size="13" text-anchor="middle">${Math.round(spd)}</text>`;
}

    const cloud = avg('cloud_cover'), wind = avg('wind_speed_10m'), rain = idx.reduce((s,i)=>s+h.precipitation[i],0);
    let score = 0, why = [];
    if (dp <= -3) { score += 3; why.push('glass falling ' + dp.toFixed(0)); } else if (dp <= -1) { score += 2; why.push('glass easing'); } else if (dp >= 2) { score -= 2; why.push('glass rising'); }
    if (p1 <= 1015) { score += 1; why.push('low pressure'); } else if (p1 >= 1024) { score -= 2; why.push('high pressure'); }
    if (cloud >= 70) { score += 1; why.push('overcast'); } else if (cloud <= 30 && bk.name==='Day') { score -= 1; why.push('bright'); }
    if (wind >= 15) { score += 1; why.push('good wind'); } else if (wind < 6) { score -= 1; why.push('flat calm'); }
    if (rain > 0.5 && rain < 8) { score += 1; why.push('some rain'); } else if (rain >= 8) { why.push('heavy rain'); }
    if (bk.name === 'Night') score += 1;
    const tag = score >= 4 ? ['#63b37a','Fish hard'] : score >= 2 ? ['#4f9cc2','Fish'] : score >= 0 ? ['#e6a33a','Dawn and dusk'] : ['#5a5e59','Rest'];
    const dt = new Date(bk.dayKey+'T12:00');
    html += `<div class="blk"><span class="tag" style="background:${tag[0]}"></span><span class="when">${days[dt.getDay()]} ${bk.name.toLowerCase()}</span><span>${tag[1]}<span class="why">${why.join(', ') || 'nothing much moving'}</span></span></div>`;
  });
  $('blocks').innerHTML = html || '<div class="blk"><span class="when"></span><span>Forecast only runs 7 days ahead.</span></div>';
}
async function load() {
  if (!cur) return;
  $('err').textContent='';
  $('place').innerHTML = cur.name + '<br><small>' + (cur.sub||'') + '</small>';
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${cur.lat}&longitude=${cur.lon}&current=pressure_msl,temperature_2m,wind_speed_10m,wind_direction_10m,cloud_cover&hourly=pressure_msl,temperature_2m,wind_speed_10m,wind_direction_10m,cloud_cover,precipitation&daily=sunrise,sunset&past_days=3&forecast_days=7&timezone=auto`;
  try {
    const d = await (await fetch(url,{cache:'no-store'})).json(); data = d;
    const c=d.current, h=d.hourly;
    let idx=h.time.indexOf(c.time.slice(0,13)+':00'); if(idx<0) idx=72;
    const d3=c.pressure_msl-h.pressure_msl[Math.max(0,idx-3)];
    $('p').textContent=c.pressure_msl.toFixed(1);
    $('trend').className='trend '+(d3<=-0.5?'falling':d3>=0.5?'rising':'steady');
    $('arrow').textContent=d3<=-0.5?'↓':d3>=0.5?'↑':'→';
    $('trendtext').textContent=(d3<=-0.5?'Falling':d3>=0.5?'Rising':'Steady')+' · '+(d3>=0?'+':'')+d3.toFixed(1)+' hPa over 3 h';
    const [cls,msg]=verdictFor(c.pressure_msl,d3); $('verdict').className='verdict '+cls; $('verdict').textContent=msg;
    const wt = h.temperature_2m.slice(Math.max(0,idx-72), idx+1).reduce((s,v)=>s+v,0)/Math.min(73,idx+1);
    const [rig,rwhy]=rigFor(c.pressure_msl,d3,wt,c.wind_speed_10m,c.cloud_cover);
    $('rig').innerHTML='<b>'+rig+'</b><br>'+rwhy;
    $('temp').textContent=Math.round(c.temperature_2m)+'°C';
    $('wtemp').textContent=Math.round(wt)+'°C';
    $('cloud').textContent=Math.round(c.cloud_cover)+'%';
    const rain12 = h.precipitation.slice(idx, idx+12).reduce((s,v)=>s+v,0);
    $('rain').textContent = rain12 < 0.2 ? 'Dry' : rain12.toFixed(1)+' mm';
    const today = c.time.slice(0,10), di = d.daily.time.indexOf(today);
    $('sun').textContent = di>=0 ? hhmm(d.daily.sunrise[di])+' / '+hhmm(d.daily.sunset[di]) : '—';
    $('moon').textContent = moonPhase(new Date());
    const dir = dirs[Math.round(c.wind_direction_10m/45)%8];
    drawRose(c.wind_direction_10m, c.wind_speed_10m);
    $('windtext').innerHTML = c.wind_speed_10m < 5 ? 'Flat calm. No wind to fish to; go on fish you can see.' : `Blowing from the <b>${dir}</b> at ${Math.round(c.wind_speed_10m)} km/h.<br>Set up on the <b>${compass[dir]}</b> bank, where it's hitting.`;
    draw(h.time.slice(idx-12, idx+37), h.pressure_msl.slice(idx-12, idx+37), 12);
    if (!$('d1').value) { $('d1').value = today; const e=new Date(); e.setDate(e.getDate()+2); $('d2').value = e.toISOString().slice(0,10); }
    plan();
    $('stamp').textContent='Live · '+new Date().toTimeString().slice(0,5);
  } catch(e) { $('err').textContent="Couldn't reach the weather service. Check signal and refresh."; }
}
function choose(sel) {
  cur=sel; try{localStorage.setItem('carpbaro',JSON.stringify(sel));}catch(e){}
  $('list').style.display='none'; $('q').value=''; $('q').blur(); load();
}
let geoTimer=null;
$('q').addEventListener('input', e => {
  const v=e.target.value.trim().toLowerCase(); const L=$('list');
  if (v.length<2) { L.style.display='none'; return; }
  let hits=LAKES.filter(l=>(l[0]+' '+l[1]).toLowerCase().includes(v)).slice(0,8).map(l=>({name:l[0],sub:l[1],lat:l[2],lon:l[3]}));
  const render=()=>{ L.innerHTML=hits.map((h,i)=>`<div data-i="${i}">${h.name}<small>${h.sub}</small></div>`).join('')||'<div><small>No match yet, keep typing</small></div>'; L.style.display='block'; L.querySelectorAll('div[data-i]').forEach(el=>el.onclick=()=>choose(hits[+el.dataset.i])); };
  render();
  clearTimeout(geoTimer);
  geoTimer=setTimeout(async()=>{
    try {
      const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=5&language=en&format=json`)).json();
      (g.results||[]).filter(r=>['GB','FR','IE'].includes(r.country_code)).forEach(r=>hits.push({name:r.name,sub:'Near '+[r.admin2||r.admin1,r.country].filter(Boolean).join(', '),lat:r.latitude,lon:r.longitude}));
      hits=hits.slice(0,10); render();
    } catch(e){}
  },400);
});
$('geo').addEventListener('click',()=>{
  if(!navigator.geolocation){ $('err').textContent='Location not available on this browser.'; return; }
  navigator.geolocation.getCurrentPosition(pos=>choose({name:'My location',sub:'',lat:+pos.coords.latitude.toFixed(3),lon:+pos.coords.longitude.toFixed(3)}),()=>{ $('err').textContent='Location was blocked. Search by town instead.'; });
});
$('d1').addEventListener('change',plan); $('d2').addEventListener('change',plan);
$('btn').addEventListener('click',load);
(function(){
  const county = l => (l[1].split(',').pop() || 'Other').trim() || 'Other';
  const groups = {};
  LAKES.forEach(l => { (groups[county(l)] = groups[county(l)] || []).push(l); });
  const B = $('browse');
  B.innerHTML = Object.keys(groups).sort().map(g => '<h3>'+g+'</h3>' + groups[g].sort((a,b)=>a[0].localeCompare(b[0])).map(l => `<div data-l="${l[0].replace(/"/g,'&quot;')}">${l[0]}<small>${l[1]}</small></div>`).join('')).join('');
  B.querySelectorAll('div[data-l]').forEach(el => el.onclick = () => { const l = LAKES.find(x=>x[0]===el.dataset.l); if (l) { B.classList.remove('open'); $('browsebtn').textContent='Browse all waters'; choose({name:l[0],sub:l[1],lat:l[2],lon:l[3]}); } });
  $('browsebtn').addEventListener('click', () => { const o = B.classList.toggle('open'); $('browsebtn').textContent = o ? 'Close list' : 'Browse all waters'; });
})();
document.addEventListener('click',e=>{ if(!e.target.closest('.pick')) $('list').style.display='none'; });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
setInterval(load,15*60*1000);
load();
})();
</script>
